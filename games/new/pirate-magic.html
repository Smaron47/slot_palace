<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pirate Magic Slot Engine</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body {
            background: #05020a;
            color: #fff;
            font-family: 'Rajdhani', sans-serif;
            overflow: hidden;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Dynamic GIF Background Layer */
        #bgLayer {
            position: fixed;
            inset: 0;
            z-index: 0;
            background: #000 center/cover no-repeat url('../../assets/bg1.gif');
            opacity: 0.95;
            filter: brightness(1.05);
            transition: background-image 0.8s ease, filter 0.5s ease;
        }

        /* Loading Screen Overlay */
        #loadingOverlay {
            position: fixed;
            inset: 0;
            z-index: 9999;
            background: #000 center/cover no-repeat url('../../assets/loading&win.gif');
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            padding-bottom: 60px;
            transition: opacity 0.6s ease;
        }
        .loading-bar-container {
            width: min(400px, 80vw);
            height: 18px;
            background: rgba(0, 0, 0, 0.7);
            border: 2px solid #FFD700;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.6);
        }
        .loading-bar {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #FF00E5, #00F0FF, #FFD700);
            transition: width 0.3s ease;
        }
        .loading-text {
            font-family: 'Orbitron', sans-serif;
            margin-top: 12px;
            font-size: 1rem;
            color: #FFD700;
            letter-spacing: 2px;
            text-shadow: 0 0 10px #FFD700;
        }

        /* Glass Game Container */
        #gameContainer {
            position: relative;
            z-index: 10;
            width: min(1040px, 96vw);
            height: min(690px, 94vh);
            background: linear-gradient(150deg, rgba(30, 15, 45, 0.45), rgba(8, 4, 15, 0.65));
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 2px solid rgba(0, 240, 255, 0.4);
            border-radius: 28px;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.9), inset 0 0 40px rgba(0, 240, 255, 0.15);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Top Bar Navigation */
        .top-bar {
            height: 60px;
            padding: 10px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0, 0, 0, 0.55);
            border-bottom: 1px solid rgba(0, 240, 255, 0.3);
        }
        .game-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.4rem;
            font-weight: 900;
            color: #00F0FF;
            text-shadow: 0 0 14px rgba(0, 240, 255, 0.7);
            letter-spacing: 2px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .theme-badge {
            font-size: 0.75rem;
            background: rgba(255, 0, 229, 0.25);
            border: 1px solid #FF00E5;
            padding: 3px 10px;
            border-radius: 12px;
            color: #FFB6E8;
        }
        .top-controls {
            display: flex;
            gap: 12px;
            align-items: center;
        }
        .spin-tracker {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.8rem;
            color: #FFD700;
            background: rgba(0,0,0,0.6);
            border: 1px solid #FFD700;
            padding: 6px 14px;
            border-radius: 8px;
        }

        /* Main Game Layout */
        .main-area {
            flex: 1;
            display: flex;
            position: relative;
            padding: 16px;
            gap: 16px;
        }
        .reel-container {
            flex: 1;
            position: relative;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 18px;
            border: 1px solid rgba(0, 240, 255, 0.35);
            box-shadow: inset 0 0 50px rgba(0,0,0,0.9);
            overflow: hidden;
        }
        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* Right Control Dashboard */
        .dashboard {
            width: 250px;
            background: rgba(15, 8, 25, 0.7);
            border: 1px solid rgba(0, 240, 255, 0.3);
            border-radius: 18px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            gap: 12px;
        }
        .stat-box {
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(0, 240, 255, 0.25);
            border-radius: 12px;
            padding: 10px;
            text-align: center;
        }
        .stat-label {
            font-size: 0.75rem;
            color: #00F0FF;
            letter-spacing: 1px;
            font-weight: 700;
            text-transform: uppercase;
        }
        .stat-value {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.4rem;
            font-weight: 900;
            color: #FFF;
            text-shadow: 0 0 10px rgba(0, 240, 255, 0.6);
            margin-top: 4px;
        }

        /* Spin Controls */
        .controls {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .bet-adjust {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0,0,0,0.4);
            border-radius: 8px;
            padding: 4px;
        }
        .btn-bet {
            width: 38px;
            height: 38px;
            background: linear-gradient(180deg, #00F0FF, #0088CC);
            border: none;
            border-radius: 8px;
            color: #000;
            font-weight: 900;
            font-size: 1.2rem;
            cursor: pointer;
            transition: 0.15s;
        }
        .btn-bet:hover { filter: brightness(1.2); }
        .spin-btn {
            height: 64px;
            background: radial-gradient(circle, #FFE57F 0%, #FFD700 50%, #FF8F00 100%);
            border: 2px solid #FFF;
            border-radius: 14px;
            color: #000;
            font-family: 'Orbitron', sans-serif;
            font-size: 1.4rem;
            font-weight: 900;
            cursor: pointer;
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.7);
            transition: transform 0.1s, filter 0.2s;
        }
        .spin-btn:hover {
            transform: scale(1.03);
            filter: brightness(1.2);
        }
        .spin-btn:disabled {
            filter: grayscale(0.8);
            cursor: not-allowed;
            transform: none;
        }

        /* Full Screen GIF Overlays */
        .overlay-gif {
            position: absolute;
            inset: 0;
            z-index: 500;
            display: flex;
            justify-content: center;
            align-items: center;
            background-size: cover;
            background-position: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
        }
        .overlay-gif.active {
            opacity: 1;
            pointer-events: auto;
        }

        #txOverlay {
            background-image: url('../../assets/transaction.gif');
            z-index: 800;
        }

        #winOverlay {
            background-color: rgba(0, 0, 0, 0.65);
            backdrop-filter: blur(8px);
            z-index: 900;
        }
        #winBox {
            width: min(480px, 92%);
            height: 300px;
            background: #000 center/contain no-repeat url('../../assets/win.gif');
            border: 3px solid #FFD700;
            border-radius: 20px;
            box-shadow: 0 0 70px rgba(255, 215, 0, 0.8);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            animation: winPop 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes winPop {
            0% { transform: scale(0.3); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        .win-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 2.2rem;
            font-weight: 900;
            color: #FFD700;
            text-shadow: 0 0 20px #FFD700, 0 0 40px #FF00E5;
            background: rgba(0,0,0,0.5);
            padding: 4px 20px;
            border-radius: 12px;
        }
        .win-amount {
            font-family: 'Orbitron', sans-serif;
            font-size: 3rem;
            font-weight: 900;
            color: #00F0FF;
            text-shadow: 0 0 25px #00F0FF;
            margin-top: 10px;
            background: rgba(0,0,0,0.6);
            padding: 6px 24px;
            border-radius: 12px;
            border: 1px solid rgba(0,240,255,0.5);
        }
    </style>

<body>

    <!-- Dynamic Background -->
    <div id="bgLayer"></div>

    <!-- Loading Screen -->
    <div id="loadingOverlay">
        <div class="loading-bar-container">
            <div class="loading-bar" id="loadBar"></div>
        </div>
        <div class="loading-text" id="loadText">LOADING ASSETS 0%</div>
    </div>

    <!-- Game Cabinet -->
    <div id="gameContainer">
        <!-- Top Bar -->
        <div class="top-bar">
            <div class="game-title">
                🏴‍☠️ PIRATE MAGIC SLOT
                <span class="theme-badge">MULTIVERSE ENGINE</span>
            </div>
            <div class="top-controls">
                <div class="spin-tracker" id="spinTrackerText">SPINS TO SCATTER: 15</div>
            </div>
        </div>

        <!-- Main Canvas Area -->
        <div class="main-area">
            <div class="reel-container">
                <canvas id="slotCanvas"></canvas>
            </div>

            <!-- Dashboard -->
            <div class="dashboard">
                <div class="stat-box">
                    <div class="stat-label">BALANCE</div>
                    <div class="stat-value" id="balanceVal">10,000</div>
                </div>

                <div class="stat-box">
                    <div class="stat-label">WIN AMOUNT</div>
                    <div class="stat-value" id="winVal" style="color: #00FF88;">0</div>
                </div>

                <div class="stat-box">
                    <div class="stat-label">MULTIPLIER</div>
                    <div class="stat-value" id="multVal" style="color: #FF00E5;">×1</div>
                </div>

                <div class="controls">
                    <div class="stat-label">BET AMOUNT</div>
                    <div class="bet-adjust">
                        <button class="btn-bet" id="btnBetDown">-</button>
                        <div class="stat-value" id="betVal" style="font-size:1.1rem;">20</div>
                        <button class="btn-bet" id="btnBetUp">+</button>
                    </div>
                    <button class="spin-btn" id="spinBtn">SPIN</button>
                </div>
            </div>
        </div>

        <!-- Full-Screen Transaction GIF Overlay -->
        <div class="overlay-gif" id="txOverlay"></div>

        <!-- Big Win GIF Overlay -->
        <div class="overlay-gif" id="winOverlay">
            <div id="winBox">
                <div class="win-title" id="winTierText">BIG WIN!</div>
                <div class="win-amount" id="winAmountText">+0</div>
            </div>
        </div>
    </div>

    <script>
        // Assets Configuration & Coordinates
        const SYMBOL_MANIFEST = {
            "Gemini_Generated_Image_i35z31i35z31i35z.jpg": [
                {"x": 91, "y": 78, "width": 226, "height": 295},
                {"x": 347, "y": 78, "width": 226, "height": 292},
                {"x": 604, "y": 78, "width": 224, "height": 292},
                {"x": 859, "y": 77, "width": 226, "height": 295},
                {"x": 859, "y": 412, "width": 226, "height": 308},
                {"x": 603, "y": 411, "width": 225, "height": 309},
                {"x": 1115, "y": 76, "width": 221, "height": 295},
                {"x": 1114, "y": 411, "width": 224, "height": 308},
                {"x": 89, "y": 412, "width": 230, "height": 309},
                {"x": 347, "y": 411, "width": 224, "height": 310}
            ],
            "Gemini_Generated_Image_qkhh8pqkhh8pqkhh.jpg": [
                {"x": 11, "y": 19, "width": 316, "height": 322},
                {"x": 348, "y": 18, "width": 311, "height": 323},
                {"x": 12, "y": 366, "width": 315, "height": 322},
                {"x": 347, "y": 366, "width": 317, "height": 320},
                {"x": 13, "y": 702, "width": 312, "height": 328},
                {"x": 346, "y": 703, "width": 316, "height": 324},
                {"x": 682, "y": 363, "width": 313, "height": 322},
                {"x": 683, "y": 18, "width": 312, "height": 323}
            ],
            "ultimate_multi_slot_sprite.jpg": [
                {"x": 25, "y": 402, "width": 82, "height": 64},
                {"x": 115, "y": 401, "width": 78, "height": 67},
                {"x": 199, "y": 403, "width": 78, "height": 61},
                {"x": 287, "y": 402, "width": 75, "height": 66},
                {"x": 376, "y": 401, "width": 73, "height": 69},
                {"x": 25, "y": 477, "width": 79, "height": 58},
                {"x": 116, "y": 474, "width": 77, "height": 60},
                {"x": 202, "y": 474, "width": 75, "height": 60},
                {"x": 289, "y": 481, "width": 66, "height": 46},
                {"x": 372, "y": 477, "width": 79, "height": 60},
                {"x": 27, "y": 569, "width": 69, "height": 84},
                {"x": 112, "y": 568, "width": 66, "height": 85},
                {"x": 197, "y": 569, "width": 65, "height": 84},
                {"x": 280, "y": 569, "width": 65, "height": 84}
            ]
        };

        const BG_LIST = ['bg1.gif', 'bg4_piret1.gif', 'bg5_piret2.gif', 'bg6_magic1.gif', 'bg10.gif', 'bg11.gif'];

        // Game Configuration
        const COLS = 5;
        const ROWS = 3;
        const MIN_BET = 10;
        const MAX_BET = 1000;
        const BET_STEP = 10;
        const SCATTER_CYCLE = 15; // Guaranteed scatter every 15 spins

        let balance = 10000;
        let bet = 20;
        let lastWin = 0;
        let multiplier = 1;
        let spinCount = 0;
        let isSpinning = false;
        let assetsReady = false;

        const symbolList = [];
        const loadedImages = {};

        // Asset Loader
        function loadGameAssets(onComplete) {
            const files = Object.keys(SYMBOL_MANIFEST);
            let loaded = 0;

            files.forEach(file => {
                const img = new Image();
                img.onload = () => {
                    const coords = SYMBOL_MANIFEST[file] || [];
                    coords.forEach((crop, idx) => {
                        symbolList.push({
                            id: symbolList.length,
                            img: img,
                            crop: crop,
                            isScatter: (file.includes('qkhh') && idx === 0), // Define scatter
                            payout: Math.floor(Math.random() * 5) + 3
                        });
                    });
                    loaded++;
                    updateProgress(loaded, files.length);
                };
                img.onerror = () => {
                    loaded++;
                    updateProgress(loaded, files.length);
                };
                loadedImages[file] = img;
                img.src = '../../assets/' + file;
            });
        }

        function updateProgress(current, total) {
            const pct = Math.round((current / total) * 100);
            document.getElementById('loadBar').style.width = pct + '%';
            document.getElementById('loadText').textContent = `LOADING ASSETS ${pct}%`;
            if (current >= total) {
                setTimeout(() => {
                    const overlay = document.getElementById('loadingOverlay');
                    overlay.style.opacity = '0';
                    setTimeout(() => overlay.style.display = 'none', 600);
                    assetsReady = true;
                    initBoard();
                    drawBoard();
                    updateUI();
                }, 500);
            }
        }

        // Canvas Engine & Rendering
        const canvas = document.getElementById('slotCanvas');
        const ctx = canvas.getContext('2d');
        let board = [];
        let winningCells = [];

        function resizeCanvas() {
            const parent = canvas.parentElement;
            canvas.width = Math.max(1, parent.clientWidth);
            canvas.height = Math.max(1, parent.clientHeight);
            drawBoard();
        }
        window.addEventListener('resize', resizeCanvas);

        function initBoard() {
            board = [];
            if (symbolList.length === 0) return;
            for (let c = 0; c < COLS; c++) {
                const col = [];
                for (let r = 0; r < ROWS; r++) {
                    col.push(getRandomSymbolIndex());
                }
                board.push(col);
            }
        }

        function getRandomSymbolIndex(forceScatter = false) {
            if (forceScatter) {
                const scatterIdx = symbolList.findIndex(s => s.isScatter);
                if (scatterIdx !== -1) return scatterIdx;
            }
            return Math.floor(Math.random() * symbolList.length);
        }

        // Render Game Grid with Drop Animation
        let animOffset = [0, 0, 0, 0, 0];

        function drawBoard() {
    // Board grid ready na thakle draw execute hobe na
    if (!board || board.length === 0) return;

    ctx.clearRect(0, 0, canvas.width, canvas.height);
    const cellW = canvas.width / COLS;
    const cellH = canvas.height / ROWS;

    for (let c = 0; c < COLS; c++) {
        if (!board[c]) continue; // Column undefined thakle skip korbe
        for (let r = 0; r < ROWS; r++) {
            const x = c * cellW;
            const y = r * cellH + (animOffset[c] || 0);

            // Cell Glass Plate
            ctx.fillStyle = 'rgba(0,0,0,0.4)';
            ctx.strokeStyle = 'rgba(0,240,255,0.18)';
            ctx.lineWidth = 1;
            ctx.beginPath();
            if (ctx.roundRect) ctx.roundRect(x + 5, y + 5, cellW - 10, cellH - 10, 12);
            else ctx.rect(x + 5, y + 5, cellW - 10, cellH - 10);
            ctx.fill();
            ctx.stroke();

            // Check Win Highlight
            const isWinning = winningCells.some(cell => cell.c === c && cell.r === r);
            if (isWinning) {
                ctx.fillStyle = 'rgba(0, 240, 255, 0.25)';
                ctx.strokeStyle = '#00F0FF';
                ctx.lineWidth = 3;
                ctx.strokeRect(x + 6, y + 6, cellW - 12, cellH - 12);
            }

            // Render Symbol Image
            const symIdx = board[c][r];
            const sym = symbolList[symIdx];
            if (sym && sym.img) {
                try {
                    ctx.drawImage(
                        sym.img,
                        sym.crop.x, sym.crop.y, sym.crop.width, sym.crop.height,
                        x + 14, y + 14, cellW - 28, cellH - 28
                    );
                } catch (e) {}
            }
        }
    }
}

        // Spin Logic with Guaranteed Scatter / Big Win Logic
        function startSpin() {
            if (isSpinning || !assetsReady) return;
            if (balance < bet) {
                balance = 10000; // Auto Refill
            }

            isSpinning = true;
            balance -= bet;
            lastWin = 0;
            winningCells = [];
            spinCount++;

            // Dynamic Background Shift every 3 spins
            if (spinCount % 3 === 0) {
                const newBg = BG_LIST[Math.floor(Math.random() * BG_LIST.length)];
                document.getElementById('bgLayer').style.backgroundImage = `url('../../assets/${newBg}')`;
            }

            updateUI();

            const isGuaranteedScatter = (spinCount % SCATTER_CYCLE === 0);
            const duration = 1600;
            const startTime = performance.now();

            function animateSpin(now) {
                const elapsed = now - startTime;
                if (elapsed < duration) {
                    for (let c = 0; c < COLS; c++) {
                        animOffset[c] = (Math.sin(elapsed / 50 + c) * 12);
                        for (let r = 0; r < ROWS; r++) {
                            board[c][r] = getRandomSymbolIndex();
                        }
                    }
                    drawBoard();
                    requestAnimationFrame(animateSpin);
                } else {
                    // Final Reel Landing with Bounce
                    animOffset = [0, 0, 0, 0, 0];
                    for (let c = 0; c < COLS; c++) {
                        for (let r = 0; r < ROWS; r++) {
                            board[c][r] = getRandomSymbolIndex();
                        }
                    }

                    // Inject Guaranteed Scatter on 15th Spin
                    if (isGuaranteedScatter) {
                        board[0][1] = getRandomSymbolIndex(true);
                        board[2][1] = getRandomSymbolIndex(true);
                        board[4][1] = getRandomSymbolIndex(true);
                    }

                    drawBoard();
                    evaluateResults(isGuaranteedScatter);
                }
            }
            requestAnimationFrame(animateSpin);
        }

        // Win Evaluation Engine
        function evaluateResults(isGuaranteedScatter) {
            let winAmount = 0;

            // Payline Check (Middle Line Match)
            const midRow = board.map(col => col[1]);
            const firstSym = midRow[0];
            let matchCount = 1;

            for (let i = 1; i < midRow.length; i++) {
                if (midRow[i] === firstSym) {
                    matchCount++;
                } else break;
            }

            if (matchCount >= 3) {
                const sym = symbolList[firstSym];
                winAmount = Math.round(bet * sym.payout * matchCount * multiplier);
                winningCells = Array.from({length: matchCount}, (_, i) => ({c: i, r: 1}));
                multiplier = Math.min(10, multiplier + 1);
            } else if (isGuaranteedScatter) {
                // Guaranteed Big Win Bonus
                winAmount = bet * 25 * multiplier;
                winningCells = [{c:0, r:1}, {c:2, r:1}, {c:4, r:1}];
                multiplier = Math.min(10, multiplier + 2);
            } else {
                multiplier = 1;
            }

            drawBoard();

            if (winAmount > 0) {
                balance += winAmount;
                lastWin = winAmount;

                // Trigger Full Screen Transaction Animation for Big Wins
                if (winAmount >= bet * 10 || isGuaranteedScatter) {
                    showTransactionThenWin(winAmount);
                } else {
                    showWinOverlay(winAmount);
                    isSpinning = false;
                    updateUI();
                }
            } else {
                isSpinning = false;
                updateUI();
            }
        }

        // Overlay & Transitions
        function showTransactionThenWin(amount) {
            const tx = document.getElementById('txOverlay');
            tx.classList.add('active');
            setTimeout(() => {
                tx.classList.remove('active');
                showWinOverlay(amount);
                isSpinning = false;
                updateUI();
            }, 1400);
        }

        function showWinOverlay(amount) {
            const winOverlay = document.getElementById('winOverlay');
            document.getElementById('winTierText').textContent = amount >= bet * 20 ? 'MEGA WIN!' : 'BIG WIN!';
            document.getElementById('winAmountText').textContent = '+' + amount.toLocaleString();
            winOverlay.classList.add('active');
            setTimeout(() => {
                winOverlay.classList.remove('active');
            }, 2500);
        }

        function updateUI() {
            document.getElementById('balanceVal').textContent = balance.toLocaleString();
            document.getElementById('betVal').textContent = bet.toLocaleString();
            document.getElementById('winVal').textContent = lastWin.toLocaleString();
            document.getElementById('multVal').textContent = '×' + multiplier;

            const remainingSpins = SCATTER_CYCLE - (spinCount % SCATTER_CYCLE);
            document.getElementById('spinTrackerText').textContent = `SPINS TO SCATTER: ${remainingSpins === 0 ? SCATTER_CYCLE : remainingSpins}`;

            const spinBtn = document.getElementById('spinBtn');
            if (isSpinning) {
                spinBtn.textContent = 'SPINNING…';
                spinBtn.disabled = true;
            } else {
                spinBtn.textContent = 'SPIN';
                spinBtn.disabled = false;
            }
        }

        // Controls Event Handlers
        document.getElementById('spinBtn').addEventListener('click', startSpin);
        document.getElementById('btnBetUp').addEventListener('click', () => {
            if (!isSpinning && bet < MAX_BET) { bet += BET_STEP; updateUI(); }
        });
        document.getElementById('btnBetDown').addEventListener('click', () => {
            if (!isSpinning && bet > MIN_BET) { bet -= BET_STEP; updateUI(); }
        });

        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space' || e.code === 'Enter') {
                e.preventDefault();
                startSpin();
            }
        });
// Start Game Execution Order
        initBoard(); // Safe initial board generate korbe
        resizeCanvas();

<script id="gp-win-gif-script">
(function(){
  if (window.__gpWinGif) return; window.__gpWinGif = true;
  var BIG = /\b(?:(?:SUPERNOVA|NOVA|MEGA|BIG|SUPER|ULTRA|EPIC|GRAND|JACKPOT|LEGENDARY|MYTHIC)\b[\s!]*WIN|MEGAWIN)\b/i;
  var busy = false;
  function ov(id){ return document.getElementById(id); }
  function show(el){ if (el) el.style.display = 'flex'; }
  function hide(el){ if (el) el.style.display = 'none'; }
  function visible(el){
    if (!el) return false;
    var st = window.getComputedStyle(el);
    if (st.display === 'none' || st.visibility === 'hidden') return false;
    if (parseFloat(st.opacity || '1') < 0.05) return false;
    var r = el.getBoundingClientRect();
    return r.width > 0 && r.height > 0;
  }
  function overlayish(el){
    for (var p = el, i = 0; p && i < 4; p = p.parentElement, i++){
      var st = window.getComputedStyle(p);
      if (st.position === 'fixed' || st.position === 'absolute') return true;
      var idc = ((p.id || '') + ' ' + (typeof p.className === 'string' ? p.className : '')).toLowerCase();
      if (/win|tier|ov|modal|box/.test(idc)) return true;
    }
    return false;
  }
  window.gpPlayBigWinGif = function(){
    if (busy) return; busy = true;
    var lo = ov('gp-overlay-loading'), w = ov('gp-overlay-win');
    show(lo);
    setTimeout(function(){
      hide(lo); show(w);
      setTimeout(function(){ hide(w); busy = false; }, 2100);
    }, 650);
  };
  function check(node, defer){
    if (!node || node.nodeType !== 1) return;
    if (!visible(node)){
      if (!defer){
        var probe = ((node.id || '') + ' ' + (typeof node.className === 'string' ? node.className : '')).toLowerCase();
        var probeTxt = (node.textContent || '').slice(0, 160);
        if (/win|overlay|modal|tier|box/.test(probe) || BIG.test(probeTxt)){
          setTimeout(function(){ check(node, true); }, 260);
        }
      }
      return;
    }
    if (!overlayish(node)) return;
    var t = (node.textContent || '').slice(0, 160);
    var dt = (node.getAttribute && node.getAttribute('data-tier')) || '';
    if (BIG.test(t) || BIG.test(dt)) window.gpPlayBigWinGif();
  }
  function start(){
    var mo = new MutationObserver(function(muts){
      for (var i = 0; i < muts.length; i++){
        var m = muts[i];
        if (m.type === 'attributes') check(m.target);
        else if (m.type === 'childList'){
          for (var j = 0; j < m.addedNodes.length; j++){
            var n = m.addedNodes[j];
            check(n && n.nodeType === 3 ? n.parentElement : n);
          }
        }
        else if (m.type === 'characterData'){
          check(m.target && m.target.parentElement);
        }
      }
    });
    mo.observe(document.body, { subtree: true, attributes: true, attributeFilter: ['class', 'style', 'data-tier'], childList: true, characterData: true });
  }
  if (document.body) start();
  else document.addEventListener('DOMContentLoaded', start);
})();
</script>
