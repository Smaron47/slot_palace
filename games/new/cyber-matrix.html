<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CYBER MATRIX - MULTI-SPRITE DUAL AXIS ENGINE</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body {
            background: #020208;
            color: #fff;
            font-family: 'Rajdhani', sans-serif;
            overflow: hidden;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Cyber Ambient BG */
        #bgLayer {
            position: fixed;
            inset: 0;
            z-index: 0;
            background: radial-gradient(circle at center, #0f051d 0%, #020208 100%);
        }
        #bgGrid {
            position: fixed;
            inset: 0;
            z-index: 1;
            background-image: 
                linear-gradient(to right, rgba(0, 240, 255, 0.06) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 0, 128, 0.06) 1px, transparent 1px);
            background-size: 40px 40px;
            transform: perspective(500px) rotateX(60deg) translateY(-100px) scale(2);
            animation: gridMove 8s linear infinite;
        }

        @keyframes gridMove {
            0% { background-position: 0 0; }
            100% { background-position: 0 40px; }
        }

        /* Loading Overlay */
        #loadingOverlay {
            position: fixed;
            inset: 0;
            z-index: 9999;
            background: #020208;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 0.5s ease;
        }
        .loading-bar-container {
            width: min(380px, 80vw);
            height: 16px;
            background: rgba(0, 0, 0, 0.8);
            border: 2px solid #00F0FF;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.5);
        }
        .loading-bar {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #FF007A, #00F0FF, #FFD700);
            transition: width 0.3s ease;
        }
        .loading-text {
            font-family: 'Orbitron', sans-serif;
            margin-top: 14px;
            font-size: 0.9rem;
            color: #00F0FF;
            letter-spacing: 2px;
            text-shadow: 0 0 10px #00F0FF;
        }

        /* Game Container */
        #gameContainer {
            position: relative;
            z-index: 10;
            width: min(1020px, 95vw);
            height: min(720px, 92vh);
            background: rgba(8, 6, 20, 0.85);
            backdrop-filter: blur(18px);
            border: 2px solid #00F0FF;
            border-radius: 24px;
            box-shadow: 0 0 50px rgba(0, 240, 255, 0.25), inset 0 0 30px rgba(255, 0, 128, 0.2);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Top Header & Gradient Title */
        .top-bar {
            height: 68px;
            padding: 10px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0, 0, 0, 0.8);
            border-bottom: 1px solid rgba(0, 240, 255, 0.25);
        }

        .gradient-title-box {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .gradient-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.8rem;
            font-weight: 900;
            letter-spacing: 3px;
            text-transform: uppercase;
            background: linear-gradient(90deg, #FF007A, #00F0FF, #FFD700, #00FF88, #7000FF, #FF007A);
            background-size: 400% 400%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: gradientShift 5s ease infinite, titleGlow 2s ease-in-out infinite alternate;
            filter: drop-shadow(0 0 12px rgba(0, 240, 255, 0.8));
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        @keyframes titleGlow {
            0% { filter: drop-shadow(0 0 10px #00F0FF); transform: scale(0.99); }
            100% { filter: drop-shadow(0 0 22px #FF007A); transform: scale(1.02); }
        }

        .mode-badge {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.75rem;
            padding: 6px 14px;
            border-radius: 8px;
            background: rgba(0, 240, 255, 0.1);
            border: 1px solid #00F0FF;
            color: #00F0FF;
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.3);
        }

        /* Main Game Layout */
        .main-area {
            flex: 1;
            display: flex;
            padding: 16px;
            gap: 16px;
        }

        .reel-container {
            flex: 1;
            position: relative;
            background: rgba(0, 0, 0, 0.75);
            border-radius: 16px;
            border: 1.5px solid rgba(255, 255, 255, 0.12);
            box-shadow: inset 0 0 40px rgba(0,0,0,0.9);
            overflow: hidden;
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* Dashboard Panel */
        .dashboard {
            width: 240px;
            background: rgba(5, 3, 14, 0.85);
            border: 1px solid rgba(0, 240, 255, 0.2);
            border-radius: 16px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            gap: 10px;
        }

        .stat-box {
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            padding: 10px;
            text-align: center;
        }
        .stat-label {
            font-size: 0.7rem;
            color: #00F0FF;
            letter-spacing: 1.5px;
            font-weight: 700;
        }
        .stat-value {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.25rem;
            font-weight: 900;
            color: #FFF;
            margin-top: 4px;
        }

        /* Controls */
        .controls {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .bet-adjust {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0,0,0,0.5);
            border-radius: 8px;
            padding: 4px;
        }
        .btn-bet {
            width: 36px;
            height: 36px;
            background: #00F0FF;
            border: none;
            border-radius: 6px;
            color: #000;
            font-weight: 900;
            font-size: 1.1rem;
            cursor: pointer;
        }
        .spin-btn {
            height: 60px;
            background: linear-gradient(135deg, #FF007A, #7000FF);
            border: 2px solid #FFF;
            border-radius: 14px;
            color: #FFF;
            font-family: 'Orbitron', sans-serif;
            font-size: 1.3rem;
            font-weight: 900;
            cursor: pointer;
            box-shadow: 0 0 25px rgba(255, 0, 122, 0.6);
            transition: 0.2s;
        }
        .spin-btn:hover {
            transform: scale(1.02);
            filter: brightness(1.2);
        }
        .spin-btn:disabled {
            filter: grayscale(0.8);
            cursor: not-allowed;
            transform: none;
        }
    </style>

        </div>

    <script>
        // Sprite Manifest
        const SYMBOL_MANIFEST = {
            "Gemini_Generated_Image_i35z31i35z31i35z.jpg": [
                {"x": 91, "y": 78, "width": 226, "height": 295},
                {"x": 347, "y": 78, "width": 226, "height": 292},
                {"x": 604, "y": 78, "width": 224, "height": 292},
                {"x": 859, "y": 77, "width": 226, "height": 295}
            ],
            "Gemini_Generated_Image_qkhh8pqkhh8pqkhh.jpg": [
                {"x": 11, "y": 19, "width": 316, "height": 322},
                {"x": 348, "y": 18, "width": 311, "height": 323},
                {"x": 12, "y": 366, "width": 315, "height": 322},
                {"x": 347, "y": 366, "width": 317, "height": 320}
            ],
            "ultimate_multi_slot_sprite.jpg": [
                {"x": 25, "y": 402, "width": 82, "height": 64},
                {"x": 115, "y": 401, "width": 78, "height": 67},
                {"x": 199, "y": 403, "width": 78, "height": 61},
                {"x": 287, "y": 402, "width": 75, "height": 66}
            ]
        };

        const COLS = 5;
        const ROWS = 4;
        let balance = 10000;
        let bet = 20;
        let lastWin = 0;
        let cascadeMultiplier = 1;
        let isSpinning = false;
        let assetsReady = false;

        const loadedSprites = {};
        const allLoadedSymbols = [];

        let board = [];
        let renderState = [];
        let blastState = [];

        function loadSpriteAssets(onComplete) {
            const files = Object.keys(SYMBOL_MANIFEST);
            let loaded = 0;

            files.forEach(file => {
                const img = new Image();
                img.onload = () => {
                    loadedSprites[file] = img;
                    loaded++;
                    updateProgress(loaded, files.length, onComplete);
                };
                img.onerror = () => {
                    loaded++;
                    updateProgress(loaded, files.length, onComplete);
                };
                img.src = '../../assets/' + file;
            });
        }

        function updateProgress(curr, total, onComplete) {
            const pct = Math.round((curr / total) * 100);
            document.getElementById('loadBar').style.width = pct + '%';
            document.getElementById('loadText').textContent = `LOADING SPRITE ASSETS ${pct}%`;
            if (curr >= total) {
                parseAndMixSymbols();
                setTimeout(() => {
                    const overlay = document.getElementById('loadingOverlay');
                    overlay.style.opacity = '0';
                    setTimeout(() => overlay.style.display = 'none', 500);
                    assetsReady = true;
                    onComplete();
                }, 300);
            }
        }

        function parseAndMixSymbols() {
            Object.keys(SYMBOL_MANIFEST).forEach(file => {
                const coords = SYMBOL_MANIFEST[file];
                const img = loadedSprites[file];

                coords.forEach((crop, idx) => {
                    allLoadedSymbols.push({
                        img: img,
                        crop: crop,
                        payout: (idx + 2) * 3,
                        isWild: (idx === 0)
                    });
                });
            });
        }

        const canvas = document.getElementById('slotCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            const parent = canvas.parentElement;
            canvas.width = Math.max(1, parent.clientWidth);
            canvas.height = Math.max(1, parent.clientHeight);
            drawBoard();
        }
        window.addEventListener('resize', resizeCanvas);

        function initBoard() {
            board = [];
            renderState = [];
            for (let c = 0; c < COLS; c++) {
                const col = [];
                const renderCol = [];
                for (let r = 0; r < ROWS; r++) {
                    col.push(getRandomSymbolIndex());
                    renderCol.push({
                        xOffset: 0,
                        yOffset: 0,
                        scale: 1,
                        rotation: 0
                    });
                }
                board.push(col);
                renderState.push(renderCol);
            }
        }

        function getRandomSymbolIndex() {
            if (allLoadedSymbols.length === 0) return 0;
            return Math.floor(Math.random() * allLoadedSymbols.length);
        }

        // Draw Matrix Grid with Image Sprite Icons & Laser Implosion Effect
        function drawBoard() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const cellW = canvas.width / COLS;
            const cellH = canvas.height / ROWS;

            for (let c = 0; c < COLS; c++) {
                for (let r = 0; r < ROWS; r++) {
                    const render = renderState[c][r];
                    const x = c * cellW + render.xOffset;
                    const y = r * cellH + render.yOffset;
                    const symIdx = board[c][r];
                    const sym = allLoadedSymbols[symIdx];

                    const isBlasting = blastState.some(b => b.c === c && b.r === r);

                    ctx.save();

                    // Grid Cell Plate
                    ctx.fillStyle = 'rgba(0, 0, 0, 0.55)';
                    ctx.strokeStyle = isBlasting ? '#FF007A' : 'rgba(0, 240, 255, 0.22)';
                    ctx.lineWidth = isBlasting ? 3 : 1;
                    if (isBlasting) {
                        ctx.shadowColor = '#FF007A';
                        ctx.shadowBlur = 20;
                    }

                    ctx.beginPath();
                    if (ctx.roundRect) ctx.roundRect(x + 5, y + 5, cellW - 10, cellH - 10, 10);
                    else ctx.rect(x + 5, y + 5, cellW - 10, cellH - 10);
                    ctx.fill();
                    ctx.stroke();

                    // Render Image Sprite Icon
                    if (sym && sym.img) {
                        const centerX = x + cellW / 2;
                        const centerY = y + cellH / 2;

                        if (isBlasting) {
                            const blastData = blastState.find(b => b.c === c && b.r === r);
                            const progress = blastData ? blastData.progress : 0;

                            // 1. Vortex Implosion Scale & Spin
                            ctx.translate(centerX, centerY);
                            ctx.rotate(progress * Math.PI * 6);
                            const scale = Math.max(0, 1 - progress);
                            ctx.scale(scale, scale);

                            // 2. Cross Laser Slice Beams
                            ctx.strokeStyle = '#00F0FF';
                            ctx.lineWidth = 4;
                            ctx.shadowColor = '#00F0FF';
                            ctx.shadowBlur = 25;
                            ctx.beginPath();
                            ctx.moveTo(-cellW, -cellH);
                            ctx.lineTo(cellW, cellH);
                            ctx.moveTo(cellW, -cellH);
                            ctx.lineTo(-cellW, cellH);
                            ctx.stroke();

                            // Draw Sprite Image
                            ctx.drawImage(
                                sym.img,
                                sym.crop.x, sym.crop.y, sym.crop.width, sym.crop.height,
                                -cellW / 2 + 10, -cellH / 2 + 10, cellW - 20, cellH - 20
                            );

                        } else {
                            // Normal Image Sprite Render with Multi-Axis Transform
                            ctx.translate(centerX, centerY);
                            ctx.scale(render.scale, render.scale);
                            ctx.rotate(render.rotation);

                            if (sym.isWild) {
                                ctx.shadowColor = '#FFD700';
                                ctx.shadowBlur = 18;
                            }

                            ctx.drawImage(
                                sym.img,
                                sym.crop.x, sym.crop.y, sym.crop.width, sym.crop.height,
                                -cellW / 2 + 10, -cellH / 2 + 10, cellW - 20, cellH - 20
                            );
                        }
                    }

                    ctx.restore();
                }
            }
        }

        // Multi-Directional Spin Mechanics (Horizontal + Vertical + Warp)
        function startSpin() {
            if (isSpinning || !assetsReady) return;
            if (balance < bet) balance = 10000;

            isSpinning = true;
            balance -= bet;
            lastWin = 0;
            cascadeMultiplier = 1;
            updateUI();

            const startTime = performance.now();
            const spinDuration = 1100;

            function animateMultiAxis(now) {
                const elapsed = now - startTime;
                const progress = Math.min(1, elapsed / spinDuration);

                const cellW = canvas.width / COLS;
                const cellH = canvas.height / ROWS;

                for (let c = 0; c < COLS; c++) {
                    for (let r = 0; r < ROWS; r++) {
                        const render = renderState[c][r];

                        if (r % 2 === 0) {
                            render.xOffset = (1 - progress) * (cellW * (c % 2 === 0 ? 3 : -3));
                        } else {
                            render.yOffset = (1 - progress) * (cellH * (r % 2 === 0 ? 3 : -3));
                        }

                        render.scale = 0.3 + (progress * 0.7);
                        render.rotation = (1 - progress) * Math.PI;
                    }
                }

                drawBoard();

                if (progress < 1) {
                    requestAnimationFrame(animateMultiAxis);
                } else {
                    for (let c = 0; c < COLS; c++) {
                        for (let r = 0; r < ROWS; r++) {
                            board[c][r] = getRandomSymbolIndex();
                            renderState[c][r] = { xOffset: 0, yOffset: 0, scale: 1, rotation: 0 };
                        }
                    }
                    drawBoard();
                    setTimeout(processCascades, 200);
                }
            }

            requestAnimationFrame(animateMultiAxis);
        }

        // Cascade Engine with Laser Implosion Effect
        function processCascades() {
            const winningCells = evaluateBoard();

            if (winningCells.length > 0) {
                let stepWin = winningCells.length * bet * 0.4 * cascadeMultiplier;
                lastWin += stepWin;
                balance += stepWin;

                blastState = winningCells.map(cell => ({ c: cell.c, r: cell.r, progress: 0 }));

                let blastStart = performance.now();
                const blastDuration = 550;

                function animateImplosion(now) {
                    const elapsed = now - blastStart;
                    const p = Math.min(1, elapsed / blastDuration);

                    blastState.forEach(b => b.progress = p);
                    drawBoard();

                    if (p < 1) {
                        requestAnimationFrame(animateImplosion);
                    } else {
                        blastState = [];
                        refillMatrix(winningCells);
                        cascadeMultiplier++;
                        updateUI();
                        drawBoard();

                        setTimeout(processCascades, 300);
                    }
                }

                requestAnimationFrame(animateImplosion);

            } else {
                isSpinning = false;
                if (lastWin >= bet * 10 && window.gpPlayBigWinGif) window.gpPlayBigWinGif();
                updateUI();
            }
        }

        function refillMatrix(crashed) {
            crashed.forEach(cell => {
                board[cell.c][cell.r] = getRandomSymbolIndex();
            });
        }

        function evaluateBoard() {
            const winningCells = [];

            for (let r = 0; r < ROWS; r++) {
                let matchLength = 1;
                let currentLine = [{ c: 0, r }];

                for (let c = 1; c < COLS; c++) {
                    const prevSym = allLoadedSymbols[board[c - 1][r]];
                    const curSym = allLoadedSymbols[board[c][r]];

                    if ((curSym && prevSym) && (curSym.isWild || prevSym.isWild || board[c][r] === board[c - 1][r])) {
                        matchLength++;
                        currentLine.push({ c, r });
                    } else {
                        if (matchLength >= 3) {
                            currentLine.forEach(cell => winningCells.push(cell));
                        }
                        matchLength = 1;
                        currentLine = [{ c, r }];
                    }
                }
                if (matchLength >= 3) {
                    currentLine.forEach(cell => winningCells.push(cell));
                }
            }

            const uniqueCells = [];
            winningCells.forEach(cell => {
                if (!uniqueCells.some(u => u.c === cell.c && u.r === cell.r)) {
                    uniqueCells.push(cell);
                }
            });

            return uniqueCells;
        }

        function updateUI() {
            document.getElementById('balanceVal').textContent = balance.toLocaleString();
            document.getElementById('betVal').textContent = bet.toLocaleString();
            document.getElementById('winVal').textContent = Math.round(lastWin).toLocaleString();
            document.getElementById('multVal').textContent = '×' + cascadeMultiplier;

            const spinBtn = document.getElementById('spinBtn');
            if (isSpinning) {
                spinBtn.textContent = 'SPINNING…';
                spinBtn.disabled = true;
            } else {
                spinBtn.textContent = 'CYBER SPIN';
                spinBtn.disabled = false;
            }
        }

        document.getElementById('spinBtn').addEventListener('click', startSpin);

        document.getElementById('btnBetUp').addEventListener('click', () => {
            if (!isSpinning && bet < 1000) { bet += 10; updateUI(); }
        });
        document.getElementById('btnBetDown').addEventListener('click', () => {
            if (!isSpinning && bet > 10) { bet -= 10; updateUI(); }
        });

        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space' || e.code === 'Enter') {
                e.preventDefault();
                startSpin();
            }
        });

        loadSpriteAssets(() => {
            initBoard();
            resizeCanvas();
        });
    </script>

<script id="gp-win-gif-script">
(function(){
  if (window.__gpWinGif) return; window.__gpWinGif = true;
  var BIG = /\b(?:(?:SUPERNOVA|NOVA|MEGA|BIG|SUPER|ULTRA|EPIC|GRAND|JACKPOT|LEGENDARY|MYTHIC)\b[\s!]*WIN|MEGAWIN)\b/i;
  var busy = false;
  function ov(id){ return document.getElementById(id); }
  function show(el){ if (el) el.style.display = 'flex'; }
  function hide(el){ if (el) el.style.display = 'none'; }
  function visible(el){
    if (!el) return false;
    var st = window.getComputedStyle(el);
    if (st.display === 'none' || st.visibility === 'hidden') return false;
    if (parseFloat(st.opacity || '1') < 0.05) return false;
    var r = el.getBoundingClientRect();
    return r.width > 0 && r.height > 0;
  }
  function overlayish(el){
    for (var p = el, i = 0; p && i < 4; p = p.parentElement, i++){
      var st = window.getComputedStyle(p);
      if (st.position === 'fixed' || st.position === 'absolute') return true;
      var idc = ((p.id || '') + ' ' + (typeof p.className === 'string' ? p.className : '')).toLowerCase();
      if (/win|tier|ov|modal|box/.test(idc)) return true;
    }
    return false;
  }
  window.gpPlayBigWinGif = function(){
    if (busy) return; busy = true;
    var lo = ov('gp-overlay-loading'), w = ov('gp-overlay-win');
    show(lo);
    setTimeout(function(){
      hide(lo); show(w);
      setTimeout(function(){ hide(w); busy = false; }, 2100);
    }, 650);
  };
  function check(node, defer){
    if (!node || node.nodeType !== 1) return;
    if (!visible(node)){
      if (!defer){
        var probe = ((node.id || '') + ' ' + (typeof node.className === 'string' ? node.className : '')).toLowerCase();
        var probeTxt = (node.textContent || '').slice(0, 160);
        if (/win|overlay|modal|tier|box/.test(probe) || BIG.test(probeTxt)){
          setTimeout(function(){ check(node, true); }, 260);
        }
      }
      return;
    }
    if (!overlayish(node)) return;
    var t = (node.textContent || '').slice(0, 160);
    var dt = (node.getAttribute && node.getAttribute('data-tier')) || '';
    if (BIG.test(t) || BIG.test(dt)) window.gpPlayBigWinGif();
  }
  function start(){
    var mo = new MutationObserver(function(muts){
      for (var i = 0; i < muts.length; i++){
        var m = muts[i];
        if (m.type === 'attributes') check(m.target);
        else if (m.type === 'childList'){
          for (var j = 0; j < m.addedNodes.length; j++){
            var n = m.addedNodes[j];
            check(n && n.nodeType === 3 ? n.parentElement : n);
          }
        }
        else if (m.type === 'characterData'){
          check(m.target && m.target.parentElement);
        }
      }
    });
    mo.observe(document.body, { subtree: true, attributes: true, attributeFilter: ['class', 'style', 'data-tier'], childList: true, characterData: true });
  }
  if (document.body) start();
  else document.addEventListener('DOMContentLoaded', start);
})();
</script>
