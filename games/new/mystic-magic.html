<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mystic Magic Slot Adventure</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body {
            background: #050510;
            color: #fff;
            font-family: 'Rajdhani', sans-serif;
            overflow: hidden;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Magic Theme Background */
        #bgLayer {
            position: fixed;
            inset: 0;
            z-index: 0;
            background: #000 center/cover no-repeat url('../../assets/bg6_magic1.gif');
            opacity: 0.85;
            filter: brightness(1.1) contrast(1.2);
        }

        /* Game Container */
        #gameContainer {
            position: relative;
            z-index: 10;
            width: min(1050px, 98vw);
            height: min(700px, 95vh);
            background: linear-gradient(135deg, rgba(20, 10, 40, 0.8), rgba(10, 5, 20, 0.9));
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 2px solid rgba(138, 43, 226, 0.6);
            border-radius: 20px;
            box-shadow: 0 0 50px rgba(138, 43, 226, 0.5), inset 0 0 20px rgba(138, 43, 226, 0.3);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Top Bar */
        .top-bar {
            height: 65px;
            padding: 0 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0, 0, 0, 0.6);
            border-bottom: 2px solid rgba(138, 43, 226, 0.5);
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
        }
        .game-title {
            font-family: 'Cinzel', serif;
            font-size: 1.6rem;
            font-weight: 900;
            color: #E0B0FF;
            text-shadow: 0 0 15px rgba(138, 43, 226, 0.8);
            letter-spacing: 3px;
        }
        .speed-control select {
            background: rgba(20, 10, 40, 0.8);
            border: 1px solid #8A2BE2;
            color: #E0B0FF;
            padding: 8px 15px;
            border-radius: 8px;
            font-family: 'Cinzel', serif;
            font-weight: 700;
            cursor: pointer;
            outline: none;
        }

        /* Main Game Area */
        .main-area {
            flex: 1;
            display: flex;
            padding: 20px;
            gap: 20px;
        }
        .reel-container {
            flex: 1;
            position: relative;
            background: rgba(0, 0, 0, 0.7);
            border-radius: 12px;
            border: 2px solid rgba(138, 43, 226, 0.4);
            box-shadow: inset 0 0 30px rgba(0,0,0,0.9);
            overflow: hidden;
        }
        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* Dashboard */
        .dashboard {
            width: 250px;
            background: rgba(10, 5, 20, 0.8);
            border: 1px solid rgba(138, 43, 226, 0.4);
            border-radius: 12px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }
        .stat-box {
            background: rgba(20, 10, 40, 0.6);
            border: 1px solid rgba(138, 43, 226, 0.3);
            border-radius: 8px;
            padding: 12px;
            text-align: center;
        }
        .stat-label {
            font-size: 0.8rem;
            color: #D8BFD8;
            letter-spacing: 2px;
            font-weight: 700;
        }
        .stat-value {
            font-family: 'Cinzel', serif;
            font-size: 1.5rem;
            font-weight: 900;
            color: #FFF;
            text-shadow: 0 0 10px #8A2BE2;
            margin-top: 5px;
        }

        /* Controls */
        .controls {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .bet-adjust {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0,0,0,0.5);
            border-radius: 8px;
            padding: 5px;
            border: 1px solid rgba(138, 43, 226, 0.3);
        }
        .btn-bet {
            width: 40px;
            height: 40px;
            background: linear-gradient(180deg, #8A2BE2, #4B0082);
            border: none;
            border-radius: 6px;
            color: #FFF;
            font-weight: 900;
            font-size: 1.3rem;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-bet:hover { filter: brightness(1.2); }
        .btn-bet:disabled { filter: grayscale(1); opacity: 0.5; cursor: not-allowed; }
        
        .spin-btn {
            height: 65px;
            background: linear-gradient(45deg, #8A2BE2, #9400D3, #4B0082);
            border: 2px solid #E0B0FF;
            border-radius: 10px;
            color: #FFF;
            font-family: 'Cinzel', serif;
            font-size: 1.5rem;
            font-weight: 900;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(138, 43, 226, 0.6);
            transition: transform 0.1s, filter 0.2s;
            text-shadow: 0 0 5px #000;
        }
        .spin-btn:hover { transform: scale(1.02); filter: brightness(1.2); }
        .spin-btn:disabled { filter: grayscale(1); cursor: not-allowed; transform: none; }

        /* Win Overlay */
        .overlay {
            position: absolute;
            inset: 0;
            z-index: 500;
            display: flex;
            justify-content: center;
            align-items: center;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(5px);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }
        .overlay.active {
            opacity: 1;
            pointer-events: auto;
        }
        #winBox {
            width: min(500px, 90%);
            height: 300px;
            background: #000 center/contain no-repeat url('../../assets/win.gif');
            border: 3px solid #8A2BE2;
            border-radius: 15px;
            box-shadow: 0 0 50px rgba(138, 43, 226, 0.8);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .win-title {
            font-family: 'Cinzel', serif;
            font-size: 2.5rem;
            font-weight: 900;
            color: #E0B0FF;
            text-shadow: 0 0 20px #8A2BE2;
        }
        .win-amount {
            font-family: 'Cinzel', serif;
            font-size: 3rem;
            font-weight: 900;
            color: #FFF;
            text-shadow: 0 0 30px #9400D3;
            margin-top: 15px;
        }
    </style>

<body>

    <div id="bgLayer"></div>

    <div id="gameContainer">
        <div class="top-bar">
            <div class="game-title">✨ MYSTIC MULTI-SLOT</div>
            <div class="speed-control">
                <select id="speedSel">
                    <option value="0.5">🐢 SLOW</option>
                    <option value="1" selected>⚡ NORMAL</option>
                    <option value="2">🚀 FAST</option>
                </select>
            </div>
        </div>

        <div class="main-area">
            <div class="reel-container">
                <canvas id="slotCanvas"></canvas>
            </div>

            <div class="dashboard">
                <div class="stat-box">
                    <div class="stat-label">MANA (BALANCE)</div>
                    <div class="stat-value" id="balanceVal">10,000</div>
                </div>
                <div class="stat-box">
                    <div class="stat-label">LAST WIN</div>
                    <div class="stat-value" id="winVal" style="color: #00FF88;">0</div>
                </div>
                <div class="controls">
                    <div class="stat-label" style="text-align:center;">BET AMOUNT</div>
                    <div class="bet-adjust">
                        <button class="btn-bet" id="btnBetDown">-</button>
                        <div class="stat-value" id="betVal" style="font-size:1.2rem; margin:0;">20</div>
                        <button class="btn-bet" id="btnBetUp">+</button>
                    </div>
                    <button class="spin-btn" id="spinBtn">CAST SPIN</button>
                </div>
            </div>
        </div>

        <div class="overlay" id="winOverlay">
            <div id="winBox">
                <div class="win-title" id="winTierText">MAGIC WIN!</div>
                <div class="win-amount" id="winAmountText">+0</div>
            </div>
        </div>
    </div>

    <script>
        const SYMBOL_MANIFEST = {
            "ultimate_multi_slot_sprite.jpg": [
                {"x": 25, "y": 402, "width": 82, "height": 64},
                {"x": 115, "y": 401, "width": 78, "height": 67},
                {"x": 199, "y": 403, "width": 78, "height": 61},
                {"x": 287, "y": 402, "width": 75, "height": 66},
                {"x": 376, "y": 401, "width": 73, "height": 69},
                {"x": 25, "y": 477, "width": 79, "height": 58},
                {"x": 116, "y": 474, "width": 77, "height": 60},
                {"x": 202, "y": 474, "width": 75, "height": 60}
            ]
        };

        const COLS = 5;
        const ROWS = 3;
        const MIN_BET = 10;
        const MAX_BET = 1000;
        const BET_STEP = 10;
        
        let balance = 10000;
        let bet = 20;
        let lastWin = 0;
        let isSpinning = false;
        let assetsReady = false;

        const symbolList = [];
        const loadedImages = {};

        // Fallback symbols just in case
        function buildFallbackSymbols() {
            const colors = ['#FF5252', '#69F0AE', '#40C4FF', '#E040FB', '#FFAB40', '#FFFF00', '#00E5FF', '#FFD700'];
            for (let i = 0; i < colors.length; i++) {
                const off = document.createElement('canvas');
                off.width = 128; off.height = 128;
                const octx = off.getContext('2d');
                octx.fillStyle = colors[i];
                octx.fillRect(10, 10, 108, 108);
                octx.fillStyle = '#000';
                octx.font = 'bold 50px Arial';
                octx.textAlign = 'center';
                octx.textBaseline = 'middle';
                octx.fillText(i+1, 64, 64);
                symbolList.push({ img: off, crop: { x:0, y:0, width:128, height:128 }, payout: Math.floor(Math.random()*5)+2 });
            }
        }

        function loadAssets(cb) {
            const fileNames = Object.keys(SYMBOL_MANIFEST);
            let loadedCount = 0;
            if(fileNames.length === 0) { assetsReady = true; cb(); return; }
            for (const fileName of fileNames) {
                const img = new Image();
                img.onload = () => {
                    const coords = SYMBOL_MANIFEST[fileName];
                    for (let i = 0; i < coords.length; i++) {
                        symbolList.push({ img: img, crop: coords[i], payout: Math.floor(Math.random()*4)+2 });
                    }
                    loadedCount++;
                    if(loadedCount >= fileNames.length) { assetsReady = true; cb(); }
                };
                img.onerror = () => { loadedCount++; if(loadedCount >= fileNames.length) { assetsReady = true; cb(); } };
                img.src = '../../assets/' + fileName;
            }
            setTimeout(() => { if(!assetsReady){ assetsReady = true; cb(); } }, 3000);
        }

        const canvas = document.getElementById('slotCanvas');
        const ctx = canvas.getContext('2d');
        
        // Multi-directional Smooth Reels Setup
        let reels = [];
        let animationFrameId;

        function initReels() {
            reels = [];
            for (let c = 0; c < COLS; c++) {
                let colSymbols = [];
                // Fill reel strip with random symbols
                for(let i=0; i<20; i++) {
                    colSymbols.push(Math.floor(Math.random() * Math.max(symbolList.length, 1)));
                }
                reels.push({
                    symbols: colSymbols,
                    yOffset: 0,
                    speed: 0,
                    isSpinning: false,
                    stopIndex: -1,
                    direction: (c % 2 === 0) ? 1 : -1 // Multi-directional: Even columns go down, odd go up
                });
            }
        }

        function resizeCanvas() {
            canvas.width = canvas.parentElement.clientWidth;
            canvas.height = canvas.parentElement.clientHeight;
            if(!isSpinning) drawReels();
        }
        window.addEventListener('resize', resizeCanvas);

        function drawReels() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            if(symbolList.length === 0) return;
            
            const cellW = canvas.width / COLS;
            const cellH = canvas.height / ROWS;

            for (let c = 0; c < COLS; c++) {
                const reel = reels[c];
                
                // Draw cells for this column
                for (let r = -1; r <= ROWS; r++) {
                    // Calculate visual offset
                    let currentY = (r * cellH) + reel.yOffset;
                    
                    // Wrap around logic for smooth infinite scroll effect
                    let symbolIndex = r;
                    if(symbolIndex < 0) symbolIndex = reel.symbols.length - 1;
                    if(symbolIndex >= reel.symbols.length) symbolIndex = 0;
                    
                    const symIdx = reel.symbols[symbolIndex];
                    const sym = symbolList[symIdx];

                    if(sym && sym.img) {
                        ctx.drawImage(
                            sym.img,
                            sym.crop.x, sym.crop.y, sym.crop.width, sym.crop.height,
                            c * cellW + 15, currentY + 15, cellW - 30, cellH - 30
                        );
                    }
                }
                
                // Draw grid lines
                ctx.strokeStyle = 'rgba(138, 43, 226, 0.3)';
                ctx.lineWidth = 2;
                ctx.strokeRect(c * cellW, 0, cellW, canvas.height);
            }
            
            // Row separators
            for(let r=1; r<ROWS; r++){
                ctx.beginPath();
                ctx.moveTo(0, r*cellH);
                ctx.lineTo(canvas.width, r*cellH);
                ctx.stroke();
            }
        }

        function updateReels() {
            let allStopped = true;
            const cellH = canvas.height / ROWS;

            for (let c = 0; c < COLS; c++) {
                let reel = reels[c];
                if (reel.isSpinning) {
                    allStopped = false;
                    reel.yOffset += reel.speed * reel.direction;

                    // Reel snapping logic
                    if(reel.direction === 1) { // Moving Down
                        if(reel.yOffset >= cellH) {
                            reel.yOffset -= cellH;
                            reel.symbols.unshift(Math.floor(Math.random() * symbolList.length));
                            reel.symbols.pop();
                            
                            if(reel.stopRequested) {
                                reel.stopCounter--;
                                if(reel.stopCounter <= 0) {
                                    reel.isSpinning = false;
                                    reel.yOffset = 0;
                                }
                            }
                        }
                    } else { // Moving Up
                        if(reel.yOffset <= -cellH) {
                            reel.yOffset += cellH;
                            reel.symbols.push(Math.floor(Math.random() * symbolList.length));
                            reel.symbols.shift();

                            if(reel.stopRequested) {
                                reel.stopCounter--;
                                if(reel.stopCounter <= 0) {
                                    reel.isSpinning = false;
                                    reel.yOffset = 0;
                                }
                            }
                        }
                    }
                }
            }

            drawReels();

            if (!allStopped) {
                animationFrameId = requestAnimationFrame(updateReels);
            } else {
                evaluateWin();
            }
        }

        function runSpin() {
            if (isSpinning || !assetsReady) return;
            if (balance < bet) {
                balance = 10000; // Auto-refill for testing
                updateUI();
                return;
            }

            isSpinning = true;
            balance -= bet;
            lastWin = 0;
            updateUI();

            // Get Speed Multiplier
            const speedMultiplier = parseFloat(document.getElementById('speedSel').value);
            const baseSpeed = 25 * speedMultiplier; 

            // Start spinning all reels
            for (let c = 0; c < COLS; c++) {
                reels[c].isSpinning = true;
                reels[c].speed = baseSpeed;
                reels[c].stopRequested = false;
                
                // Stagger stop times
                setTimeout(() => {
                    reels[c].stopRequested = true;
                    reels[c].stopCounter = 5; // Extra spins before snapping
                }, (1000 + (c * 300)) / speedMultiplier);
            }

            animationFrameId = requestAnimationFrame(updateReels);
        }

        function evaluateWin() {
            let winAmount = 0;
            
            // Simplified win logic for center row
            let centerRow = reels.map(r => r.symbols[1]); // Index 1 is approx the middle row
            let first = centerRow[0];
            let matchCount = 1;

            for (let i = 1; i < centerRow.length; i++) {
                if (centerRow[i] === first) matchCount++;
                else break;
            }

            if (matchCount >= 3) {
                let sym = symbolList[first];
                winAmount = bet * (sym ? sym.payout : 2) * matchCount;
            }

            if (winAmount > 0) {
                balance += winAmount;
                lastWin = winAmount;
                showWinOverlay(winAmount);
            }

            isSpinning = false;
            updateUI();
        }

        function showWinOverlay(amount) {
            const overlay = document.getElementById('winOverlay');
            document.getElementById('winAmountText').textContent = '+' + amount;
            overlay.classList.add('active');
            
            const speed = parseFloat(document.getElementById('speedSel').value);
            setTimeout(() => {
                overlay.classList.remove('active');
            }, 2500 / speed);
        }

        function updateUI() {
            document.getElementById('balanceVal').textContent = balance.toLocaleString();
            document.getElementById('betVal').textContent = bet;
            document.getElementById('winVal').textContent = lastWin;
            
            const spinBtn = document.getElementById('spinBtn');
            spinBtn.disabled = isSpinning;
            spinBtn.textContent = isSpinning ? 'CASTING...' : 'CAST SPIN';
        }

        document.getElementById('spinBtn').addEventListener('click', runSpin);
        document.getElementById('btnBetUp').addEventListener('click', () => { if (!isSpinning && bet < MAX_BET) { bet += BET_STEP; updateUI(); } });
        document.getElementById('btnBetDown').addEventListener('click', () => { if (!isSpinning && bet > MIN_BET) { bet -= BET_STEP; updateUI(); } });

        loadAssets(() => {
            if (symbolList.length === 0) buildFallbackSymbols();
            initReels();
            resizeCanvas();
            updateUI();
        });
    </script>

<!-- GP-WIN-GIF engine -->
<style id="gp-win-gif-style">
.gp-overlay{position:fixed;inset:0;z-index:9990;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.6);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);flex-direction:column;pointer-events:none}
.gp-overlay img{max-width:min(82vw,430px);max-height:72vh;animation:gp-ov-pop .4s cubic-bezier(.175,.885,.32,1.275);filter:drop-shadow(0 14px 40px rgba(0,0,0,.55))}
@keyframes gp-ov-pop{0%{transform:scale(.55);opacity:0}70%{transform:scale(1.12);opacity:.92}100%{transform:scale(1);opacity:1}}
#gp-overlay-loading{z-index:9991}
#gp-overlay-win{z-index:9992}
#gp-overlay-tx{z-index:9993}
</style>
<script id="gp-win-gif-script">
(function(){
  if (window.__gpWinGif) return; window.__gpWinGif = true;
  var BIG = /\b(?:(?:SUPERNOVA|NOVA|MEGA|BIG|SUPER|ULTRA|EPIC|GRAND|JACKPOT|LEGENDARY|MYTHIC)\b[\s!]*WIN|MEGAWIN)\b/i;
  var busy = false;
  function ov(id){ return document.getElementById(id); }
  function show(el){ if (el) el.style.display = 'flex'; }
  function hide(el){ if (el) el.style.display = 'none'; }
  function visible(el){
    if (!el) return false;
    var st = window.getComputedStyle(el);
    if (st.display === 'none' || st.visibility === 'hidden') return false;
    if (parseFloat(st.opacity || '1') < 0.05) return false;
    var r = el.getBoundingClientRect();
    return r.width > 0 && r.height > 0;
  }
  function overlayish(el){
    for (var p = el, i = 0; p && i < 4; p = p.parentElement, i++){
      var st = window.getComputedStyle(p);
      if (st.position === 'fixed' || st.position === 'absolute') return true;
      var idc = ((p.id || '') + ' ' + (typeof p.className === 'string' ? p.className : '')).toLowerCase();
      if (/win|tier|ov|modal|box/.test(idc)) return true;
    }
    return false;
  }
  window.gpPlayBigWinGif = function(){
    if (busy) return; busy = true;
    var lo = ov('gp-overlay-loading'), w = ov('gp-overlay-win');
    show(lo);
    setTimeout(function(){
      hide(lo); show(w);
      setTimeout(function(){ hide(w); busy = false; }, 2100);
    }, 650);
  };
  function check(node, defer){
    if (!node || node.nodeType !== 1) return;
    if (!visible(node)){
      if (!defer){
        var probe = ((node.id || '') + ' ' + (typeof node.className === 'string' ? node.className : '')).toLowerCase();
        var probeTxt = (node.textContent || '').slice(0, 160);
        if (/win|overlay|modal|tier|box/.test(probe) || BIG.test(probeTxt)){
          setTimeout(function(){ check(node, true); }, 260);
        }
      }
      return;
    }
    if (!overlayish(node)) return;
    var t = (node.textContent || '').slice(0, 160);
    var dt = (node.getAttribute && node.getAttribute('data-tier')) || '';
    if (BIG.test(t) || BIG.test(dt)) window.gpPlayBigWinGif();
  }
  function start(){
    var mo = new MutationObserver(function(muts){
      for (var i = 0; i < muts.length; i++){
        var m = muts[i];
        if (m.type === 'attributes') check(m.target);
        else if (m.type === 'childList'){
          for (var j = 0; j < m.addedNodes.length; j++){
            var n = m.addedNodes[j];
            check(n && n.nodeType === 3 ? n.parentElement : n);
          }
        }
        else if (m.type === 'characterData'){
          check(m.target && m.target.parentElement);
        }
      }
    });
    mo.observe(document.body, { subtree: true, attributes: true, attributeFilter: ['class', 'style', 'data-tier'], childList: true, characterData: true });
  }
  if (document.body) start();
  else document.addEventListener('DOMContentLoaded', start);
})();
</script>
