<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PHARAOH'S SOLAR NOVA - MULTI-SPRITE ENGINE</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body {
            background: #05020a;
            color: #fff;
            font-family: 'Rajdhani', sans-serif;
            overflow: hidden;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Ambient Cosmic Sun BG */
        #bgLayer {
            position: fixed;
            inset: 0;
            z-index: 0;
            background: radial-gradient(circle at 50% 30%, #3a0d18 0%, #0d0309 60%, #030005 100%);
        }
        #sunPulse {
            position: fixed;
            top: 20%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 450px;
            height: 450px;
            background: radial-gradient(circle, rgba(255, 215, 0, 0.15) 0%, rgba(255, 0, 85, 0.05) 50%, transparent 70%);
            border-radius: 50%;
            animation: pulseGlow 6s ease-in-out infinite alternate;
            z-index: 1;
        }

        @keyframes pulseGlow {
            0% { transform: translate(-50%, -50%) scale(0.85); opacity: 0.6; }
            100% { transform: translate(-50%, -50%) scale(1.25); opacity: 1; }
        }

        /* Loading Screen Overlay */
        #loadingOverlay {
            position: fixed;
            inset: 0;
            z-index: 9999;
            background: #05020a;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 0.5s ease;
        }
        .loading-bar-container {
            width: min(380px, 80vw);
            height: 16px;
            background: rgba(0, 0, 0, 0.8);
            border: 2px solid #FFD700;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
        }
        .loading-bar {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #FF0055, #FFD700, #00FFCC);
            transition: width 0.3s ease;
        }
        .loading-text {
            font-family: 'Cinzel Decorative', serif;
            margin-top: 14px;
            font-size: 0.85rem;
            color: #FFD700;
            letter-spacing: 2px;
            text-shadow: 0 0 10px #FFD700;
        }

        /* Main Game Container */
        #gameContainer {
            position: relative;
            z-index: 10;
            width: min(1040px, 95vw);
            height: min(730px, 92vh);
            background: rgba(15, 6, 18, 0.88);
            backdrop-filter: blur(20px);
            border: 2px solid #FFD700;
            border-radius: 20px;
            box-shadow: 0 0 60px rgba(255, 215, 0, 0.25), inset 0 0 35px rgba(255, 0, 85, 0.2);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Top Bar & Metallic Gradient Title */
        .top-bar {
            height: 72px;
            padding: 10px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: linear-gradient(180deg, rgba(20, 5, 12, 0.95), rgba(8, 2, 5, 0.9));
            border-bottom: 1.5px solid rgba(255, 215, 0, 0.3);
        }

        .gradient-title {
            font-family: 'Cinzel Decorative', serif;
            font-size: 1.6rem;
            font-weight: 900;
            letter-spacing: 2px;
            text-transform: uppercase;
            background: linear-gradient(90deg, #FFD700 0%, #FFF 25%, #FF0055 50%, #00FFCC 75%, #FFD700 100%);
            background-size: 300% 100%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: goldFlow 6s linear infinite;
            filter: drop-shadow(0 0 10px rgba(255, 215, 0, 0.6));
        }

        @keyframes goldFlow {
            0% { background-position: 0% 50%; }
            100% { background-position: 300% 50%; }
        }

        .theme-badge {
            font-family: 'Cinzel Decorative', serif;
            font-size: 0.7rem;
            padding: 6px 14px;
            border-radius: 6px;
            background: rgba(255, 215, 0, 0.1);
            border: 1px solid #FFD700;
            color: #FFD700;
            box-shadow: 0 0 12px rgba(255, 215, 0, 0.3);
        }

        /* Main Game Layout */
        .main-area {
            flex: 1;
            display: flex;
            padding: 16px;
            gap: 16px;
        }

        .reel-container {
            flex: 1;
            position: relative;
            background: rgba(5, 2, 8, 0.85);
            border-radius: 14px;
            border: 1px solid rgba(255, 215, 0, 0.2);
            box-shadow: inset 0 0 50px rgba(0,0,0,0.95);
            overflow: hidden;
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* Control Panel */
        .dashboard {
            width: 250px;
            background: rgba(12, 4, 14, 0.9);
            border: 1px solid rgba(255, 215, 0, 0.25);
            border-radius: 14px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            gap: 10px;
        }

        .stat-box {
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255, 215, 0, 0.15);
            border-radius: 8px;
            padding: 10px;
            text-align: center;
        }
        .stat-label {
            font-size: 0.7rem;
            color: #FFD700;
            letter-spacing: 1.5px;
            font-weight: 700;
        }
        .stat-value {
            font-family: 'Cinzel Decorative', serif;
            font-size: 1.2rem;
            font-weight: 700;
            color: #FFF;
            margin-top: 4px;
        }

        .controls {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .bet-adjust {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0,0,0,0.6);
            border-radius: 8px;
            padding: 4px;
        }
        .btn-bet {
            width: 36px;
            height: 36px;
            background: #FFD700;
            border: none;
            border-radius: 6px;
            color: #000;
            font-weight: 900;
            font-size: 1.1rem;
            cursor: pointer;
        }
        .spin-btn {
            height: 60px;
            background: linear-gradient(135deg, #FFD700, #FF0055);
            border: 2px solid #FFF;
            border-radius: 12px;
            color: #FFF;
            font-family: 'Cinzel Decorative', serif;
            font-size: 1.2rem;
            font-weight: 900;
            cursor: pointer;
            box-shadow: 0 0 25px rgba(255, 215, 0, 0.5);
            transition: 0.2s;
        }
        .spin-btn:hover {
            transform: scale(1.02);
            filter: brightness(1.2);
        }
        .spin-btn:disabled {
            filter: grayscale(0.8);
            cursor: not-allowed;
            transform: none;
        }
    </style>

<body>

    <!-- Loader -->
    <div id="loadingOverlay">
        <div class="loading-bar-container">
            <div class="loading-bar" id="loadBar"></div>
        </div>
        <div class="loading-text" id="loadText">LOADING SPRITE SYMBOLS 0%</div>
    </div>

    <div id="gameContainer">
        <div class="top-bar">
            <div class="gradient-title">☀️ PHARAOH'S SOLAR NOVA ☀️</div>
            <div class="theme-badge">3D SPRITE FLIP ENGINE</div>
        </div>

        <div class="main-area">
            <div class="reel-container">
                <canvas id="slotCanvas"></canvas>
            </div>

            <div class="dashboard">
                <div class="stat-box">
                    <div class="stat-label">SACRED TREASURE</div>
                    <div class="stat-value" id="balanceVal">10,000</div>
                </div>

                <div class="stat-box">
                    <div class="stat-label">SOLAR PAYOUT</div>
                    <div class="stat-value" id="winVal" style="color: #00FFCC;">0</div>
                </div>

                <div class="stat-box">
                    <div class="stat-label">GOD MULTIPLIER</div>

                        <button class="btn-bet" id="btnBetDown">-</button>

                    </div>
                    <button class="spin-btn" id="spinBtn">INVOKE SUN</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Sprite Asset Coordinates Manifest
        const SYMBOL_MANIFEST = {
            "Gemini_Generated_Image_i35z31i35z31i35z.jpg": [
                {"x": 91, "y": 78, "width": 226, "height": 295},
                {"x": 347, "y": 78, "width": 226, "height": 292},
                {"x": 604, "y": 78, "width": 224, "height": 292},
                {"x": 859, "y": 77, "width": 226, "height": 295}
            ],
            "Gemini_Generated_Image_qkhh8pqkhh8pqkhh.jpg": [
                {"x": 11, "y": 19, "width": 316, "height": 322},
                {"x": 348, "y": 18, "width": 311, "height": 323},
                {"x": 12, "y": 366, "width": 315, "height": 322},
                {"x": 347, "y": 366, "width": 317, "height": 320}
            ],
            "ultimate_multi_slot_sprite.jpg": [
                {"x": 25, "y": 402, "width": 82, "height": 64},
                {"x": 115, "y": 401, "width": 78, "height": 67},
                {"x": 199, "y": 403, "width": 78, "height": 61},
                {"x": 287, "y": 402, "width": 75, "height": 66}
            ]
        };

        const COLS = 5;
        const ROWS = 4;
        let balance = 10000;
        let bet = 20;
        let lastWin = 0;
        let cascadeMultiplier = 1;
        let isSpinning = false;
        let assetsReady = false;

        const loadedSprites = {};
        const allLoadedSymbols = [];

        let board = [];
        let renderState = [];
        let blastState = []; 
        let activeParticles = [];

        function loadSpriteAssets(onComplete) {
            const files = Object.keys(SYMBOL_MANIFEST);
            let loaded = 0;

            files.forEach(file => {
                const img = new Image();
                img.onload = () => {
                    loadedSprites[file] = img;
                    loaded++;
                    updateProgress(loaded, files.length, onComplete);
                };
                img.onerror = () => {
                    loaded++;
                    updateProgress(loaded, files.length, onComplete);
                };
                img.src = '../../assets/' + file;
            });
        }

        function updateProgress(curr, total, onComplete) {
            const pct = Math.round((curr / total) * 100);
            document.getElementById('loadBar').style.width = pct + '%';
            document.getElementById('loadText').textContent = `LOADING SPRITE SYMBOLS ${pct}%`;
            if (curr >= total) {
                parseAndMixSymbols();
                setTimeout(() => {
                    const overlay = document.getElementById('loadingOverlay');
                    overlay.style.opacity = '0';
                    setTimeout(() => overlay.style.display = 'none', 500);
                    assetsReady = true;
                    onComplete();
                }, 300);
            }
        }

        function parseAndMixSymbols() {
            Object.keys(SYMBOL_MANIFEST).forEach(file => {
                const coords = SYMBOL_MANIFEST[file];
                const img = loadedSprites[file];

                coords.forEach((crop, idx) => {
                    allLoadedSymbols.push({
                        img: img,
                        crop: crop,
                        payout: (idx + 2) * 4,
                        isWild: (idx === 0)
                    });
                });
            });
        }

        const canvas = document.getElementById('slotCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            const parent = canvas.parentElement;
            canvas.width = Math.max(1, parent.clientWidth);
            canvas.height = Math.max(1, parent.clientHeight);
            drawBoard();
        }
        window.addEventListener('resize', resizeCanvas);

        function initBoard() {
            board = [];
            renderState = [];
            for (let c = 0; c < COLS; c++) {
                const col = [];
                const renderCol = [];
                for (let r = 0; r < ROWS; r++) {
                    col.push(getRandomSymbolIndex());
                    renderCol.push({ flipY: 1, scale: 1, angle: 0 });
                }
                board.push(col);
                renderState.push(renderCol);
            }
        }

        function getRandomSymbolIndex() {
            if (allLoadedSymbols.length === 0) return 0;
            return Math.floor(Math.random() * allLoadedSymbols.length);
        }

        // Canvas Rendering with Image Sprites & 3D Solar Blast Mechanics
        function drawBoard() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const cellW = canvas.width / COLS;
            const cellH = canvas.height / ROWS;

            for (let c = 0; c < COLS; c++) {
                for (let r = 0; r < ROWS; r++) {
                    const render = renderState[c][r];
                    const x = c * cellW;
                    const y = r * cellH;
                    const symIdx = board[c][r];
                    const sym = allLoadedSymbols[symIdx];

                    const isBlasting = blastState.some(b => b.c === c && b.r === r);

                    ctx.save();

                    // Gold Border Slabs
                    ctx.fillStyle = 'rgba(10, 4, 12, 0.7)';
                    ctx.strokeStyle = isBlasting ? '#FFD700' : 'rgba(255, 215, 0, 0.2)';
                    ctx.lineWidth = isBlasting ? 2.5 : 1;
                    if (isBlasting) {
                        ctx.shadowColor = '#FFD700';
                        ctx.shadowBlur = 25;
                    }

                    ctx.beginPath();
                    if (ctx.roundRect) ctx.roundRect(x + 5, y + 5, cellW - 10, cellH - 10, 12);
                    else ctx.rect(x + 5, y + 5, cellW - 10, cellH - 10);
                    ctx.fill();
                    ctx.stroke();

                    const centerX = x + cellW / 2;
                    const centerY = y + cellH / 2;

                    if (sym && sym.img) {
                        // Solar Blast Supernova Animation
                        if (isBlasting) {
                            const blastData = blastState.find(b => b.c === c && b.r === r);
                            const progress = blastData ? blastData.progress : 0;

                            // Solar Shockwave Ring
                            ctx.strokeStyle = '#FFD700';
                            ctx.lineWidth = 3;
                            ctx.beginPath();
                            ctx.arc(centerX, centerY, progress * (cellW * 0.7), 0, Math.PI * 2);
                            ctx.stroke();

                            // Expanding Sprite Image Blast
                            ctx.translate(centerX, centerY);
                            const scale = 1 + progress * 0.4;
                            ctx.scale(scale, scale);

                            ctx.shadowColor = '#FFD700';
                            ctx.shadowBlur = 30 * progress;

                            ctx.drawImage(
                                sym.img,
                                sym.crop.x, sym.crop.y, sym.crop.width, sym.crop.height,
                                -cellW / 2 + 10, -cellH / 2 + 10, cellW - 20, cellH - 20
                            );

                        } else {
                            // 3D Solar Flip Render Mode
                            ctx.translate(centerX, centerY);
                            ctx.scale(render.scale, render.flipY * render.scale);
                            ctx.rotate(render.angle);

                            if (sym.isWild) {
                                ctx.shadowColor = '#FFD700';
                                ctx.shadowBlur = 20;
                            }

                            ctx.drawImage(
                                sym.img,
                                sym.crop.x, sym.crop.y, sym.crop.width, sym.crop.height,
                                -cellW / 2 + 10, -cellH / 2 + 10, cellW - 20, cellH - 20
                            );
                        }
                    }

                    ctx.restore();
                }
            }

            // Draw Spark Particles
            activeParticles.forEach((p, idx) => {
                p.x += p.vx;
                p.y += p.vy;
                p.alpha -= 0.03;

                if (p.alpha <= 0) {
                    activeParticles.splice(idx, 1);
                } else {
                    ctx.save();
                    ctx.fillStyle = p.color;
                    ctx.globalAlpha = p.alpha;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                }
            });
        }

        // 3D Solar Radial Flip Spin
        function startSpin() {
            if (isSpinning || !assetsReady) return;
            if (balance < bet) balance = 10000;

            isSpinning = true;
            balance -= bet;
            lastWin = 0;
            cascadeMultiplier = 1;
            updateUI();

            const startTime = performance.now();
            const spinDuration = 1000;

            function animate3DFlip(now) {
                const elapsed = now - startTime;
                const progress = Math.min(1, elapsed / spinDuration);

                for (let c = 0; c < COLS; c++) {
                    for (let r = 0; r < ROWS; r++) {
                        const render = renderState[c][r];
                        render.flipY = Math.cos((progress * Math.PI * 4) + (c * 0.2));
                        render.angle = (1 - progress) * (c % 2 === 0 ? 0.3 : -0.3);
                        render.scale = 0.5 + (Math.sin(progress * Math.PI) * 0.5);
                    }
                }

                drawBoard();

                if (progress < 1) {
                    requestAnimationFrame(animate3DFlip);
                } else {
                    for (let c = 0; c < COLS; c++) {
                        for (let r = 0; r < ROWS; r++) {
                            board[c][r] = getRandomSymbolIndex();
                            renderState[c][r] = { flipY: 1, scale: 1, angle: 0 };
                        }
                    }
                    drawBoard();
                    setTimeout(processCascades, 200);
                }
            }

            requestAnimationFrame(animate3DFlip);
        }

        // Cascade Engine with Solar Explosion
        function processCascades() {
            const winningCells = evaluateBoard();

            if (winningCells.length > 0) {
                let stepWin = winningCells.length * bet * 0.5 * cascadeMultiplier;
                lastWin += stepWin;
                balance += stepWin;

                blastState = winningCells.map(cell => ({ c: cell.c, r: cell.r, progress: 0 }));

                // Spawn Spark Particles
                const cellW = canvas.width / COLS;
                const cellH = canvas.height / ROWS;
                winningCells.forEach(cell => {
                    const cx = cell.c * cellW + cellW / 2;
                    const cy = cell.r * cellH + cellH / 2;
                    for (let i = 0; i < 12; i++) {
                        activeParticles.push({
                            x: cx,
                            y: cy,
                            vx: (Math.random() - 0.5) * 8,
                            vy: (Math.random() - 0.5) * 8,
                            size: Math.random() * 4 + 2,
                            color: '#FFD700',
                            alpha: 1
                        });
                    }
                });

                let blastStart = performance.now();
                const blastDuration = 500;

                function animateBlast(now) {
                    const elapsed = now - blastStart;
                    const p = Math.min(1, elapsed / blastDuration);

                    blastState.forEach(b => b.progress = p);
                    drawBoard();

                    if (p < 1 || activeParticles.length > 0) {
                        requestAnimationFrame(animateBlast);
                    } else {
                        blastState = [];
                        refillMatrix(winningCells);
                        cascadeMultiplier++;
                        updateUI();
                        drawBoard();

                        setTimeout(processCascades, 280);
                    }
                }

                requestAnimationFrame(animateBlast);

            } else {
                isSpinning = false;
                updateUI();
            }
        }

        function refillMatrix(crashed) {
            crashed.forEach(cell => {
                board[cell.c][cell.r] = getRandomSymbolIndex();
            });
        }

        function evaluateBoard() {
            const winningCells = [];

            for (let r = 0; r < ROWS; r++) {
                let matchLength = 1;
                let currentLine = [{ c: 0, r }];

                for (let c = 1; c < COLS; c++) {
                    const prevSym = allLoadedSymbols[board[c - 1][r]];
                    const curSym = allLoadedSymbols[board[c][r]];

                    if ((curSym && prevSym) && (curSym.isWild || prevSym.isWild || board[c][r] === board[c - 1][r])) {
                        matchLength++;
                        currentLine.push({ c, r });
                    } else {
                        if (matchLength >= 3) {
                            currentLine.forEach(cell => winningCells.push(cell));
                        }
                        matchLength = 1;
                        currentLine = [{ c, r }];
                    }
                }
                if (matchLength >= 3) {
                    currentLine.forEach(cell => winningCells.push(cell));
                }
            }

            const uniqueCells = [];
            winningCells.forEach(cell => {
                if (!uniqueCells.some(u => u.c === cell.c && u.r === cell.r)) {
                    uniqueCells.push(cell);
                }
            });

            return uniqueCells;
        }

        function updateUI() {
            document.getElementById('balanceVal').textContent = balance.toLocaleString();
            document.getElementById('betVal').textContent = bet.toLocaleString();
            document.getElementById('winVal').textContent = Math.round(lastWin).toLocaleString();
            document.getElementById('multVal').textContent = '×' + cascadeMultiplier;

            const spinBtn = document.getElementById('spinBtn');
            if (isSpinning) {
                spinBtn.textContent = 'INVOKING…';
                spinBtn.disabled = true;
            } else {
                spinBtn.textContent = 'INVOKE SUN';
                spinBtn.disabled = false;
            }
        }

        document.getElementById('spinBtn').addEventListener('click', startSpin);

        document.getElementById('btnBetUp').addEventListener('click', () => {
            if (!isSpinning && bet < 1000) { bet += 10; updateUI(); }
        });
        document.getElementById('btnBetDown').addEventListener('click', () => {
            if (!isSpinning && bet > 10) { bet -= 10; updateUI(); }
        });

        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space' || e.code === 'Enter') {
                e.preventDefault();
                startSpin();
            }
        });

        loadSpriteAssets(() => {
            initBoard();
            resizeCanvas();
        });
    </script>

<script id="gp-win-gif-script">
(function(){
  if (window.__gpWinGif) return; window.__gpWinGif = true;
  var BIG = /\b(?:(?:SUPERNOVA|NOVA|MEGA|BIG|SUPER|ULTRA|EPIC|GRAND|JACKPOT|LEGENDARY|MYTHIC)\b[\s!]*WIN|MEGAWIN)\b/i;
  var busy = false;
  function ov(id){ return document.getElementById(id); }
  function show(el){ if (el) el.style.display = 'flex'; }
  function hide(el){ if (el) el.style.display = 'none'; }
  function visible(el){
    if (!el) return false;
    var st = window.getComputedStyle(el);
    if (st.display === 'none' || st.visibility === 'hidden') return false;
    if (parseFloat(st.opacity || '1') < 0.05) return false;
    var r = el.getBoundingClientRect();
    return r.width > 0 && r.height > 0;
  }
  function overlayish(el){
    for (var p = el, i = 0; p && i < 4; p = p.parentElement, i++){
      var st = window.getComputedStyle(p);
      if (st.position === 'fixed' || st.position === 'absolute') return true;
      var idc = ((p.id || '') + ' ' + (typeof p.className === 'string' ? p.className : '')).toLowerCase();
      if (/win|tier|ov|modal|box/.test(idc)) return true;
    }
    return false;
  }
  window.gpPlayBigWinGif = function(){
    if (busy) return; busy = true;
    var lo = ov('gp-overlay-loading'), w = ov('gp-overlay-win');
    show(lo);
    setTimeout(function(){
      hide(lo); show(w);
      setTimeout(function(){ hide(w); busy = false; }, 2100);
    }, 650);
  };
  function check(node, defer){
    if (!node || node.nodeType !== 1) return;
    if (!visible(node)){
      if (!defer){
        var probe = ((node.id || '') + ' ' + (typeof node.className === 'string' ? node.className : '')).toLowerCase();
        var probeTxt = (node.textContent || '').slice(0, 160);
        if (/win|overlay|modal|tier|box/.test(probe) || BIG.test(probeTxt)){
          setTimeout(function(){ check(node, true); }, 260);
        }
      }
      return;
    }
    if (!overlayish(node)) return;
    var t = (node.textContent || '').slice(0, 160);
    var dt = (node.getAttribute && node.getAttribute('data-tier')) || '';
    if (BIG.test(t) || BIG.test(dt)) window.gpPlayBigWinGif();
  }
  function start(){
    var mo = new MutationObserver(function(muts){
      for (var i = 0; i < muts.length; i++){
        var m = muts[i];
        if (m.type === 'attributes') check(m.target);
        else if (m.type === 'childList'){
          for (var j = 0; j < m.addedNodes.length; j++){
            var n = m.addedNodes[j];
            check(n && n.nodeType === 3 ? n.parentElement : n);
          }
        }
        else if (m.type === 'characterData'){
          check(m.target && m.target.parentElement);
        }
      }
    });
    mo.observe(document.body, { subtree: true, attributes: true, attributeFilter: ['class', 'style', 'data-tier'], childList: true, characterData: true });
  }
  if (document.body) start();
  else document.addEventListener('DOMContentLoaded', start);
})();
</script>
